<!DOCTYPE html>
<html lang="en">
<head>
    <title>Document</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body, html {
            height: 100%;
            margin:0;
        }
        .groen {
            display: flex;
            border: 3px green solid;
            height: 100%;
        }
        .blauw {
            border: 3px rgb(56, 52, 236) solid;
        }
        .kind1 {
            width: 70%;
        }
        .kind2 {
            width: 30%;
            background-color: blueviolet;
        }
    </style>
</head>
<body>
    <div class="groen">
        <div class="blauw kind1">
            <div>
                Eerste rij
            </div>
            <div>
                Tweede rij
            </div>
        </div>
        <div class="blauw kind2"></div>
    </div>
    
</body>
</html>
